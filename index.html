<style>
:root{--vw:1vw;--vh:1vh;--bg:#fdf0ff;--card:#fff;--ink:#3b1a5e;--mute:#7a5a9c;--line:#ecd0fa;--a:#c026d3;--g:linear-gradient(135deg,#ff7ad9,#a855f7 55%,#7c3aed);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 18% 88%,rgba(255,110,200,.6),transparent 70%),radial-gradient(50% 40% at 85% 12%,rgba(140,110,240,.55),transparent 70%),linear-gradient(225deg,#9d8cf0 0%,#b98cf2 28%,#e79af0 55%,#ff9ad5 80%,#ffc0e2 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

.hd{color:#fff;text-align:center;padding:26px 16px 22px}
.logo{font-size:60px;font-weight:700;letter-spacing:1px;text-shadow:0 4px 0 rgba(60,0,100,.3)}
.logo-w{position:relative;width:min(calc(90*var(--vw)),470px);margin:0 auto;animation:lf 5.5s ease-in-out infinite}
.logo-img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 8px rgba(255,150,240,.7))}
@keyframes lf{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-5px) rotate(.7deg)}}
.tw{position:absolute;width:24px;height:24px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.4s ease-in-out infinite;pointer-events:none}
.tw.a{left:80%;top:6%}.tw.b{left:3%;top:46%;width:20px;height:20px;animation-delay:.7s}.tw.c{left:68%;top:78%;width:28px;height:28px;animation-delay:1.3s}.tw.d{left:92%;top:40%;width:18px;height:18px;animation-delay:1.9s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
.face{display:block;aspect-ratio:600/744;height:156px;border:0;background:transparent;padding:0;margin:0 auto 6px;font-size:76px;line-height:1;will-change:transform;animation:ps 7.2s steps(1,end) infinite;-webkit-tap-highlight-color:transparent}
.face img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(80,20,120,.35))}
.face.pop img{animation:peel .6s steps(1,end) 1}
@keyframes peel{0%{clip-path:polygon(0 0,30% 0,0 30%);transform:scale(.8) rotate(-8deg)}17%{clip-path:polygon(0 0,70% 0,0 70%);transform:scale(.9) rotate(-5deg)}34%{clip-path:polygon(0 0,110% 0,0 110%);transform:scale(1.08) rotate(3deg)}51%{clip-path:polygon(0 0,150% 0,0 150%);transform:scale(1.1) rotate(-2deg)}68%{clip-path:polygon(0 0,200% 0,0 200%);transform:scale(1.04) rotate(1deg)}85%{clip-path:none;transform:scale(1)}}

let NZ=null;
function fctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function noiseB(){const c=fctx();if(!NZ){NZ=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NZ}
function fEnv(t,a,d,v){const g=fctx().createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d);return g}
function fNoise(t,d,v,ft,fq,q){const c=fctx(),s=c.createBufferSource();s.buffer=noiseB();const f=c.createBiquadFilter();f.type=ft;f.frequency.value=fq;if(q)f.Q.value=q;const g=fEnv(t,.002,d,v);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+d+.05)}
function fOsc(t,type,f1,f2,d,v){const c=fctx(),o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);const g=fEnv(t,.004,d,v);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function fDolphin(f){const c=fctx(),t=c.currentTime,b=Math.min(f*2.2,3200);[0,.24].forEach((w,i)=>{const o=c.createOscillator(),g=fEnv(t+w,.02,.22,.16),l=c.createOscillator(),lg=c.createGain();o.type='sine';o.frequency.setValueAtTime(b*.7,t+w);o.frequency.exponentialRampToValueAtTime(b*1.5,t+w+.09);o.frequency.exponentialRampToValueAtTime(b*(i?.9:1.15),t+w+.22);l.frequency.value=38;lg.gain.value=b*.04;l.connect(lg).connect(o.frequency);o.connect(g).connect(c.destination);o.start(t+w);l.start(t+w);o.stop(t+w+.3);l.stop(t+w+.3)});fNoise(t,.03,.06,'highpass',6000)}
function fCat(f){const c=fctx(),t=c.currentTime,b=Math.max(300,Math.min(f*1.5,900)),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*1.3,t+.16);o.frequency.linearRampToValueAtTime(b*.75,t+.55);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.setValueAtTime(.2,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+.6);
  [[450,800,500,5],[2200,1300,900,7]].forEach(([a1,a2,a3,q],i)=>{const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(a1,t);bp.frequency.linearRampToValueAtTime(a2,t+.2);bp.frequency.linearRampToValueAtTime(a3,t+.55);const gg=c.createGain();gg.gain.value=i?.6:1.4;o.connect(bp);bp.connect(gg).connect(g)});g.connect(c.destination);o.start(t);o.stop(t+.65)}
function fDrum(m){const t=fctx().currentTime,p=((m%12)+12)%12;
  if(p===0){fOsc(t,'sine',160,45,.22,.7);fNoise(t,.02,.15,'lowpass',900)}
  else if(p===1){fOsc(t,'square',820,700,.04,.12);fNoise(t,.05,.2,'highpass',2500)}
  else if(p===2){fNoise(t,.2,.35,'highpass',1800);fOsc(t,'triangle',220,160,.1,.3)}
  else if(p===3){[0,.012,.024].forEach(w=>fNoise(t+w,.05,.25,'bandpass',1500,1.5));fNoise(t+.036,.18,.2,'bandpass',1500,1.5)}
  else if(p===4)fNoise(t,.05,.22,'highpass',7500);
  else if(p===5)fOsc(t,'sine',150,70,.3,.6);
  else if(p===6)fNoise(t,.35,.2,'highpass',7000);
  else if(p===7)fOsc(t,'sine',200,95,.28,.55);
  else if(p===8){fOsc(t,'square',560,556,.2,.1);fOsc(t,'square',845,840,.2,.1)}
  else if(p===9)fOsc(t,'sine',260,130,.25,.5);
  else if(p===10){fNoise(t,.6,.12,'highpass',9000);fOsc(t,'sine',5200,5000,.4,.03)}
  else fNoise(t,1.3,.3,'highpass',5000)}
function fViolin(f){const c=fctx(),t=c.currentTime,g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(6000,f*5);lp.Q.value=.8;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.14);g.connect(lp).connect(c.destination);
  const os=[-6,6].map(d=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;o.connect(g);o.start(t);return o}),l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.6;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(14,t+.5);l.connect(lg);os.forEach(o=>lg.connect(o.detune));l.start(t);
  const stop=()=>{os.forEach(o=>{try{o.stop()}catch(e){}});try{l.stop()}catch(e){}};setTimeout(stop,6500);
  return{rel(){try{const n=c.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.setTargetAtTime(0,n,.1);setTimeout(stop,700)}catch(e){}}}}

<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spraute</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--vw:1vw;--vh:1vh;--bg:#fdf0ff;--card:#fff;--ink:#3b1a5e;--mute:#7a5a9c;--line:#ecd0fa;--a:#c026d3;--g:linear-gradient(135deg,#ff7ad9,#a855f7 55%,#7c3aed);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0e30;--card:#2a1650;--ink:#fbeaff;--mute:#c6a8ea;--line:#4a2a78;--a:#e879f9}}
:root[data-theme="dark"]{--bg:#1b0e30;--card:#2a1650;--ink:#fbeaff;--mute:#c6a8ea;--line:#4a2a78;--a:#e879f9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 18% 88%,rgba(255,110,200,.6),transparent 70%),radial-gradient(50% 40% at 85% 12%,rgba(140,110,240,.55),transparent 70%),linear-gradient(225deg,#9d8cf0 0%,#b98cf2 28%,#e79af0 55%,#ff9ad5 80%,#ffc0e2 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

.hd{color:#fff;text-align:center;padding:26px 16px 22px}
.logo{font-size:60px;font-weight:700;letter-spacing:1px;text-shadow:0 4px 0 rgba(60,0,100,.3)}
.logo-w{position:relative;width:min(calc(90*var(--vw)),470px);margin:0 auto;animation:lf 5.5s ease-in-out infinite}
.logo-img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 8px rgba(255,150,240,.7))}
@keyframes lf{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-5px) rotate(.7deg)}}
.tw{position:absolute;width:24px;height:24px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.4s ease-in-out infinite;pointer-events:none}
.tw.a{left:80%;top:6%}.tw.b{left:3%;top:46%;width:20px;height:20px;animation-delay:.7s}.tw.c{left:68%;top:78%;width:28px;height:28px;animation-delay:1.3s}.tw.d{left:92%;top:40%;width:18px;height:18px;animation-delay:1.9s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
.face{display:block;aspect-ratio:600/744;height:156px;border:0;background:transparent;padding:0;margin:0 auto 6px;font-size:76px;line-height:1;will-change:transform;animation:ps 7.2s steps(1,end) infinite;-webkit-tap-highlight-color:transparent}
.face img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(80,20,120,.35))}
.face.pop img{animation:peel .6s steps(1,end) 1}
@keyframes peel{0%{clip-path:polygon(0 0,30% 0,0 30%);transform:scale(.8) rotate(-8deg)}17%{clip-path:polygon(0 0,70% 0,0 70%);transform:scale(.9) rotate(-5deg)}34%{clip-path:polygon(0 0,110% 0,0 110%);transform:scale(1.08) rotate(3deg)}51%{clip-path:polygon(0 0,150% 0,0 150%);transform:scale(1.1) rotate(-2deg)}68%{clip-path:polygon(0 0,200% 0,0 200%);transform:scale(1.04) rotate(1deg)}85%{clip-path:none;transform:scale(1)}}
@keyframes ps{0%{transform:rotate(5deg)}25%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}75%{transform:rotate(0deg)}}
.face.pop{animation:pop .6s steps(1,end) 1,ps 7.2s steps(1,end) .6s infinite}
@keyframes pop{0%{transform:scale(1.22)}16%{transform:scale(1.12)}33%{transform:scale(1.2)}50%{transform:scale(1.08)}66%{transform:scale(1.12)}83%{transform:scale(1.04)}}
.cap{font-size:15px;font-weight:600;color:#4c1d95}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 14px}
.tile{aspect-ratio:1/1.05;border:0;border-radius:28px;color:#fff;text-shadow:0 2px 4px rgba(60,0,100,.6);background:var(--c);background:color-mix(in srgb,var(--c) 40%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.tile span{font-size:52px}.tile b{font-size:21px}.tile small{font-size:13px;padding:0 8px;text-align:center}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px}
.bar b{flex:1;font-size:18px}
.btn{border:0;border-radius:14px;padding:11px 14px;font:600 15px 'Fredoka',sans-serif;background:var(--g);color:#fff}
.btn.o{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[aria-pressed="true"]{outline:3px solid var(--a)}
.btn.st{background:linear-gradient(#4ade80,#16a34a);border:3px solid #fff;box-shadow:0 0 0 3px #86efac,0 0 16px rgba(34,197,94,.8);text-shadow:0 1px 2px rgba(0,60,20,.5)}
.btn.sp{background:linear-gradient(#f87171,#dc2626);border:3px solid #fff;box-shadow:0 0 0 3px #fca5a5,0 0 16px rgba(239,68,68,.8);text-shadow:0 1px 2px rgba(90,0,0,.5)}
body.score #ouvir{display:none}
#ouvir{background:linear-gradient(#c084fc,#7c3aed);color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px #d8b4fe,0 0 14px rgba(168,85,247,.8);text-shadow:0 1px 2px rgba(40,0,80,.5)}
#tutor{background:linear-gradient(#fb7185,#f59e0b);color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px #f472b6,0 0 16px rgba(251,113,133,.9);text-shadow:0 1px 2px rgba(80,0,60,.5)}
.songs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 12px 20px}
.sc{border:0;border-radius:20px;min-height:84px;color:#fff;background:var(--c);font-weight:700;font-size:17px;padding:10px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.sc span{display:block;font-size:30px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px}
.gmain{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;padding:0 12px}
.ctl{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.bpm{display:flex;align-items:center;justify-content:center;gap:8px}
.bpm button{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:700}
.bpm b{min-width:92px;text-align:center}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.small{font-size:14px;min-height:20px;text-align:center}
.sym{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px}
.big{width:clamp(80px,calc(26*var(--vh)),128px);aspect-ratio:1;border-radius:30px;display:grid;place-items:center;font-size:clamp(44px,calc(15*var(--vh)),72px);color:#fff;background:var(--line);transition:transform .08s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.big.hit{transform:scale(1.12)}
.name{font-size:22px;font-weight:700;min-height:28px}
.road{display:flex;gap:5px;min-height:30px}
.dot{width:30px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px;opacity:.75}
.kbwrap{padding:10px 12px 14px}
.kb{position:relative;display:flex;gap:2px;height:clamp(96px,calc(32*var(--vh)),200px)}
.key{border:3px solid transparent;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 6px;transition:transform .08s,opacity .1s}
.key.w{flex:1;min-width:0;border-radius:6px 6px 14px 14px;opacity:1}
.key.w .s{font-size:clamp(22px,calc(4.4*var(--vw)),44px);line-height:1}.key.w .n{font-size:10px}
.key.b{position:absolute;top:0;height:60%;background:#4a1d7a;border-radius:0 0 8px 8px;z-index:2}
.key.on{opacity:1;transform:translateY(3px);box-shadow:0 0 0 4px var(--a)}
.key.ok{opacity:1;border-color:#fff;box-shadow:0 0 0 6px #22c55e,0 0 24px 6px #22c55e;z-index:3}
.key.bad{opacity:1;box-shadow:0 0 0 6px #ef4444;z-index:3}
.key.on{animation:kp 1.5s ease-in-out infinite}
.key.ok{animation:none}
.key.w{position:relative}
.key.w::before{content:'';position:absolute;top:0;left:0;right:0;height:10px;border-radius:4px 4px 0 0;background:var(--oc);pointer-events:none}
.key.w.c0::after{content:'';position:absolute;left:-3px;top:0;bottom:0;width:4px;border-radius:2px;background:#4c1d95;z-index:1;pointer-events:none}
.key[data-o='3']{--oc:#6d28d9}.key[data-o='4']{--oc:#c026d3}.key[data-o='5']{--oc:#f472b6}.key[data-o='6']{--oc:#8b5cf6}
.octbar{position:relative;height:26px;margin-top:5px}
.os{position:absolute;top:0;height:100%;box-sizing:border-box;background:var(--oc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border-left:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 12px 12px;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;letter-spacing:1px}
#along{display:none;font-size:0}body.score #along{display:block}
#along::after{content:'🎶 Tocar junto';font-size:15px}body.along #along::after{content:'■ Parar';font-size:15px}
body.game .card{background:rgba(255,255,255,.66)}
body.game .staffc{background:rgba(255,255,255,.82)}
@keyframes kp{0%,100%{opacity:1;box-shadow:0 0 0 4px var(--a),0 0 22px 7px #fff}50%{opacity:.45;box-shadow:0 0 0 4px var(--a)}}
.od{display:block;font-size:11px;line-height:1;letter-spacing:1px;min-height:11px}
.big{align-content:center;gap:0}
.big .od{font-size:.2em;letter-spacing:.12em;margin-top:-.2em}
.dot{align-content:center}
.dot .od{font-size:8px;min-height:0;margin-top:-1px}
.max .hideMax{display:none!important}
.staffc{display:none;padding:4px 8px;background:rgba(255,255,255,.88)}
.staffsvg{display:block;width:100%;height:100%}
body.score .staffc{display:block;height:clamp(120px,calc(32*var(--vh)),210px)}
body:not(.score) .gmain{grid-template-columns:minmax(150px,.5fr) 1.9fr}
body:not(.score) .ctl .row{flex:1;flex-direction:column;gap:6px}
body:not(.score) .ctl .btn{min-height:clamp(34px,calc(10.5*var(--vh)),52px)}
body:not(.score) .ctl .small:empty{display:none}
body:not(.score) .ctl .prog{display:none}
body:not(.score) .ctl .btn{padding:4px 4px;line-height:1.1;font-size:clamp(11px,calc(3.3*var(--vh)),15px);white-space:nowrap}
body:not(.score) .ctl .bpm{gap:4px}body:not(.score) .ctl .bpm b{min-width:0;font-size:clamp(12px,calc(3.6*var(--vh)),16px)}
body:not(.score) .ctl .bpm button{width:clamp(28px,calc(5*var(--vw)),40px);height:calc(8*var(--vh))}
@media all{
body:not(.score).game .kb{height:clamp(80px,calc(calc(50*var(--vh)) - 22px),260px)}
body:not(.score) .octbar{display:none}
body:not(.score).game .gmain{height:calc(calc(50*var(--vh)) - 28px);min-height:0}
body:not(.score) .ctl{gap:4px;padding:6px 8px;overflow:hidden}
body:not(.score) .ctl .g1vl{margin:0;font-size:clamp(10px,calc(3*var(--vh)),13px)}
body.score .g1vl{display:none}
body:not(.score).game .kbwrap{padding:4px 12px 0}
body:not(.score).game .octbar{height:20px;margin-top:3px}
body:not(.score) .ctl .btn{min-height:0}
#mx{display:none!important}
body:not(.score) .ctl>.row{flex:0 0 auto}
body:not(.score) .ctl #hear,body:not(.score) .ctl #tutor,body:not(.score) .ctl #ouvir{flex:0 0 auto;height:calc(7.8*var(--vh));min-height:0;padding:0 4px}
body:not(.score) .ctl>#tutor,body:not(.score) .ctl>#ouvir{width:100%}
body:not(.score).game .sym{position:relative;padding:6px 10px}
body:not(.score).game .road{position:absolute;left:10px;top:8px;bottom:8px;flex-direction:column;gap:5px;overflow:hidden;min-height:0}
body:not(.score).game .road>*:nth-child(n+5){display:none}
body:not(.score).game .road .dot{width:calc(8*var(--vh));height:calc(8*var(--vh));border-radius:10px;font-size:calc(4.4*var(--vh));opacity:.9}
body:not(.score).game .road .dot .od{font-size:calc(1.9*var(--vh))}
body:not(.score).game .name{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-align:right;max-width:20%;min-height:0;line-height:1.05;font-size:clamp(14px,calc(5.4*var(--vh)),24px)}
body:not(.score).game .big{width:clamp(90px,calc(37*var(--vh)),190px);font-size:clamp(52px,calc(22*var(--vh)),112px);border-radius:34px}
}
body.score .gmain{grid-template-columns:1.9fr minmax(110px,.65fr)}
body.score .staffc{order:1}
body.score .sym{order:2}
body.score .gmain .ctl{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
body.score .ctl .row{flex:1 1 160px}
body.score .ctl .prog{flex:1 1 90px}
body.score .ctl .small{flex:1 1 140px;text-align:left}
body.score .road{display:none}
body.score .sym{min-height:0}
body.score .kb{height:clamp(84px,calc(24*var(--vh)),150px)}
body.score.max .staffc{height:clamp(96px,calc(28*var(--vh)),170px)}
body.score.max .kb{height:clamp(80px,calc(25*var(--vh)),200px)}
.nt .h{fill:var(--c);fill-opacity:.28;stroke:var(--c);stroke-width:2.5}
.nt.half .h{fill-opacity:.06}
.nt .s{stroke:#6d28d9;stroke-opacity:.4;stroke-width:2.5;stroke-linecap:round}
.nt .lb{opacity:.5;font-weight:700}
.nt .ring{fill:none;stroke:var(--c);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.nt.cur .ring{opacity:1;animation:pr 1s ease-in-out infinite}
.nt.cur .h{fill-opacity:.55}
.nt.fut{opacity:.6}
body.score .ctl .prog{display:none}
body.score .ctl .row{flex:0 0 auto}
body.score .ctl .btn{white-space:nowrap}
body.score .ctl .small{flex:1 1 100px;min-width:0}
body.score .big{width:clamp(60px,calc(18*var(--vh)),96px);font-size:clamp(34px,calc(10*var(--vh)),52px)}
body.score .sym{padding:6px}
body.score .name{font-size:18px;min-height:22px}
body.score.max .ctl .bpm,body.score.max .ctl .small{display:none}
.nt.cur{animation:ap .35s ease-out}
@keyframes ap{from{opacity:0}to{opacity:1}}
body.score #hear{font-size:0}body.score #hear::after{content:'↻ Recomeçar';font-size:15px}
.nt.played .h{fill-opacity:1;stroke:#fff;stroke-width:2;filter:url(#glow)}
.nt.played .s{stroke-opacity:1}
.nt.played .lb{opacity:1}
.nt .pop{transform-box:fill-box;transform-origin:center}
.nt.played .pop{animation:np .45s ease-out}
@keyframes np{40%{transform:scale(1.5)}}
@keyframes pr{50%{transform:scale(1.18);opacity:.5}}
.max .kb{height:clamp(120px,calc(48*var(--vh)),260px)}
.max #mx{position:fixed;right:14px;bottom:14px;z-index:5}
.stage{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:0 12px 16px}
.msg{font-size:20px;font-weight:600;text-align:center;min-width:200px}
.pat{display:flex;gap:10px;align-items:center;min-height:26px}
.pb{border-radius:50%;background:var(--a);flex:none}
.drum{width:150px;height:150px;border-radius:50%;border:0;font-size:70px;background:#ec4899;color:#fff;box-shadow:0 8px 0 #9d174d;transition:transform .06s}
.drum:active,.drum.hit{transform:translateY(6px);box-shadow:0 2px 0 #9d174d}
.stars{font-size:32px;min-height:40px;letter-spacing:3px}
#rot{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}

body.short .bar{padding:4px 12px}body.short .btn{padding:8px 12px}body.short .sym{min-height:0}body.short .hd{padding:10px}

#home{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0}
.hh{display:flex;align-items:center;justify-content:center;gap:calc(2*var(--vw));width:100%;padding:0 calc(6*var(--vw))}
.hh .logo-w{width:100%;margin:0}
.rc{display:flex;flex-direction:column;align-items:center;gap:calc(2*var(--vh));flex:1 1 0;min-width:0;max-width:none}.hh .fw{flex:none}
.fw{display:flex;flex-direction:column;align-items:center}
.hh .face{height:clamp(220px,calc(89*var(--vh)),500px);width:auto;margin:0 0 4px}
@media all{#home{overflow:hidden;max-height:calc(100*var(--vh))}.hh .fw{position:relative;width:calc(68*var(--vh));height:calc(100*var(--vh));flex:none}.hh .face{position:absolute;top:calc(8*var(--vh));left:0;height:calc(84*var(--vh));width:auto;margin:0}.hh .cap{position:absolute;left:calc(-10*var(--vh));right:calc(-10*var(--vh));bottom:calc(.6*var(--vh));text-align:center;font-size:clamp(12px,calc(3.6*var(--vh)),16px)}}
.play{border:0;border-radius:40px;padding:8px 52px;font:700 clamp(20px,calc(6*var(--vh)),30px) Fredoka,system-ui,sans-serif;color:#fff;background:linear-gradient(#f472b6,#c026d3);box-shadow:0 7px 0 #7e1d8f,0 0 22px rgba(255,120,230,.7);text-shadow:0 2px 3px rgba(60,0,100,.5)}
.play:active{transform:translateY(5px);box-shadow:0 2px 0 #7e1d8f}

#menu .tile span{font-size:clamp(40px,calc(13*var(--vh)),64px)}#menu .tile b{font-size:clamp(16px,calc(5*var(--vh)),24px)}#menu .tile small{font-size:clamp(11px,calc(3*var(--vh)),13px)}

.g3m{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;padding:2px 12px 0}
.g3c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:clamp(100px,calc(36*var(--vh)),170px);overflow:hidden;text-align:center}
.g3s{font-weight:700;font-size:clamp(16px,calc(5.4*var(--vh)),26px);color:#4c1d95}
.g3n{min-height:clamp(30px,calc(10*var(--vh)),54px);display:flex;justify-content:center}
.g3n span{display:grid;place-items:center;width:clamp(30px,calc(10*var(--vh)),54px);height:clamp(30px,calc(10*var(--vh)),54px);border-radius:50%;color:#fff;font-size:clamp(18px,calc(6*var(--vh)),30px);box-shadow:0 0 14px rgba(255,255,255,.9);animation:g3p .4s steps(1,end) 1}
@keyframes g3p{0%{transform:translate(-50%,-50%) scale(.5) rotate(-12deg);opacity:1}12%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}25%{transform:translate(-50%,-50%) scale(.95) rotate(-6deg)}38%{transform:translate(-50%,-50%) scale(1.2) rotate(5deg)}50%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}62%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}75%{transform:translate(-50%,-50%) scale(1) rotate(0)}88%{transform:translate(-50%,-50%) scale(1.1) rotate(0);opacity:.7}}
.g3q{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:clamp(26px,calc(8*var(--vh)),40px)}
.g3q i{font-style:normal;display:grid;place-items:center;width:clamp(26px,calc(8*var(--vh)),40px);height:clamp(26px,calc(8*var(--vh)),40px);border-radius:50%;color:#fff;font-size:clamp(14px,calc(4.4*var(--vh)),22px);opacity:.55;border:2px solid #fff}
.g3q i.lit,.g3q i.hit,.g3q i.f{opacity:1;transform:scale(1.2);box-shadow:0 0 12px #fff}.g3q i.good{opacity:1;box-shadow:0 0 0 3px #22c55e}.g3q i.miss{opacity:.9;box-shadow:0 0 0 3px #ef4444}
.g3q i.e{background:rgba(168,85,247,.18)!important;border:2px dashed #a855f7;color:transparent;opacity:1}

  for(let l=min;l<=max;l++){let s=0,a=0,b=0;for(let i=0;i<N;i+=2){const x=mbuf[i],y=mbuf[i+l];s+=x*y;a+=x*x;b+=y*y}c[l]=s/Math.sqrt(a*b+1e-9);if(c[l]>best)best=c[l]}
  if(best<0.8)return{rms,f:0};
  for(let l=min+1;l<max;l++){if(c[l]>=best*0.93&&c[l]>=c[l-1]&&c[l]>=c[l+1]){const d=c[l-1]-2*c[l]+c[l+1],sh=d?0.5*(c[l-1]-c[l+1])/d:0;return{rms,f:sr/(l+sh)}}}
  return{rms,f:0}}
function micLoop(){if(!micOn)return;requestAnimationFrame(micLoop);const g3a=!$('g3').hidden;if((!g3a&&$('g1').hidden)||run==='demo'||run==='along'||(g3a&&g3st!=='turn'))return;
  const {rms,f}=detect(),onset=rms>prevR*1.5&&rms>0.03;prevR=rms;
  if(g3a&&g3mode==='rhythm'){if(onset)g3key(0,false);return}
  if(!f){cand=-1;cnt=0;if(rms<0.012){armed=true;accPc=-1}return}
  if(onset)armed=true;
  const m=Math.round(69+12*Math.log2(f/440)),pc=((m%12)+12)%12;
  if(pc===cand)cnt++;else{cand=pc;cnt=1}
  if(cnt<4)return;if(pc!==accPc)armed=true;if(!armed)return;armed=false;accPc=pc;
  if(g3a){g3key(m,false);return}
  const x=info(pc);
  if(run==='wait'){const r=attempt(m);setMic(r?'✅ Isso! '+lab(x):'❌ Ouvi '+lab(x)+'. Procure '+lab(S.n[pos].k),r?'#16a34a':'#ef4444')}
  else{setMic('Ouvi: '+lab(x));flash(hm(m,pc),'ok');const b=$('big');b.style.background=COL[x.i];b.innerHTML=SYM[x.i]+(x.sh?'♯':'')+'<span class="od">'+od(Math.floor(m/12)-1)+'</span>';$('nm').textContent=NAMES[x.i]+(x.sh?' sustenido':'')}}

/* MIDI opcional */
if(navigator.requestMIDIAccess){navigator.requestMIDIAccess().then(a=>{a.inputs.forEach(i=>i.onmidimessage=e=>{const [s,m,v]=e.data;if((s&240)===144&&v>0){
  if(!$('eco').hidden)tap();else if(!$('beat').hidden)bTap();else if(!$('g1').hidden)g1press(m);else if(!$('g3').hidden)g3key(m,true)}})}).catch(()=>{})}

/* teclado do computador: Q W E R T Y U I O = Dó Ré Mi Fá Sol Lá Si Dó Ré */
const QK={q:60,w:62,e:64,r:65,t:67,y:69,u:71,i:72,o:74};
addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const m=QK[e.key.toLowerCase()];if(m==null)return;
  const g3a=!$('g3').hidden,g1a=!$('g1').hidden;if(!g3a&&!g1a)return;
  if(!micOn)piano(fr(m));if(g3a)g3key(m,true);else g1press(m)});
/* jogo 3: eco do ritmo */
const PATS=[[1,1,1],[1,1,2],[1,.5,.5,1],[.5,.5,1,1],[1,.5,.5,.5,.5,1],[.75,.25,1,1],[.5,.5,.5,.5,1,1]];
let pi=0,phase='idle',taps=[],ecoTimer=null;const eBeat=()=>60000/bpm;
function drawPat(){const el=$('pat');el.innerHTML='';PATS[pi].forEach(g=>{const d=document.createElement('div');d.className='pb';d.style.width=d.style.height=(14+Math.min(g,2)*10)+'px';el.appendChild(d)})}
function drum(){const d=$('drum');d.classList.add('hit');setTimeout(()=>d.classList.remove('hit'),110);tone(150,.18,'sine',.5)}
function listenReset(){phase='idle';$('stars').textContent='';$('emsg').textContent='Escute e repita!';$('next').hidden=true;drawPat()}
function listen(){clearTimeout(ecoTimer);phase='play';taps=[];$('stars').textContent='';$('next').hidden=true;$('emsg').textContent='Escute…';drawPat();
  const p=PATS[pi];let t=600;for(let i=0;i<=p.length;i++){setTimeout(drum,t);t+=(p[i]||0)*eBeat()}
  ecoTimer=setTimeout(()=>{phase='rec';taps=[];$('emsg').textContent='Sua vez! 👏';$('listen').textContent='Ouvir de novo'},t+500)}
function tap(){drum();if(phase!=='rec')return;taps.push(performance.now());clearTimeout(ecoTimer);
  if(taps.length>=PATS[pi].length+1)evalTaps();else ecoTimer=setTimeout(evalTaps,eBeat()*4)}
function evalTaps(){if(phase!=='rec')return;phase='done';const p=PATS[pi];let ok=0;
  for(let i=1;i<taps.length&&i<=p.length;i++){const exp=p[i-1]*eBeat();if(Math.abs(taps[i]-taps[i-1]-exp)<=exp*.4)ok++}
  const r=ok/p.length,st=taps.length<p.length+1?0:r>=.85?3:r>=.55?2:1;
  $('stars').textContent=st?'⭐'.repeat(st):'🙂';$('emsg').textContent=st===3?'Perfeito!':st===2?'Quase lá!':st===1?'Boa tentativa!':'Vamos ouvir de novo?';$('next').hidden=st<2}
$('drum').onpointerdown=tap;$('listen').onclick=listen;$('next').onclick=()=>{pi=(pi+1)%PATS.length;listen()};

/* jogo 4: bate no tempo */
let btimer=null,lastB=0,streak=0;
function bStart(){streak=0;$('bstreak').textContent='';$('bmsg').textContent='Bata junto com a batida!';$('bgo').textContent='Parar';
  const t=()=>{lastB=performance.now();tone(900,.06,'square',.12);pulse($('bdrum'))};t();btimer=setInterval(t,60000/bpm)}
function bStop(){clearInterval(btimer);btimer=null;$('bgo').textContent='Começar'}
$('bgo').onclick=()=>btimer?bStop():bStart();
function bTap(){tone(150,.18,'sine',.5);if(!btimer)return;const iv=60000/bpm,dt=performance.now()-lastB,err=dt<=iv/2?dt:dt-iv;
  if(Math.abs(err)<iv*.18){streak++;$('bmsg').textContent='No tempo! 🎯'}else{streak=0;$('bmsg').textContent=err<0?'Cedo demais 🐇':'Tarde demais 🐢'}
  $('bstreak').textContent='⭐'.repeat(Math.min(streak,8))}
$('bdrum').onpointerdown=bTap;
buildKb();drawPat();

/* fundo animado: estrelas com movimento sutil e glitter que brilha */
(function(){const c=$('bg'),x=c.getContext('2d'),R=Math.random,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,D,st=[],gl=[],bk=[],cl=[],mn=null,ss=[],nextSS=2,last=0,tick=0;const T0=performance.now();
const GC=['255,255,255','255,246,200','255,214,240','228,216,255'];
function cloudSprite(w,T){const h=w*.56,p=w*.16,cw=w+p*2,ch=h+p*2,cv=document.createElement('canvas');cv.width=Math.ceil(cw*D);cv.height=Math.ceil(ch*D);
  const g=cv.getContext('2d');g.scale(D,D);
  const P=[[.17,.7,.15],[.34,.5,.21],[.58,.4,.25],[.8,.62,.19],[.5,.74,.2],[.3,.78,.14],[.72,.78,.14]].map(a=>[p+w*(a[0]+(R()-.5)*.04),p+h*a[1],w*a[2]*(.94+R()*.12)]);
  g.shadowColor='rgba('+T.g+',.85)';g.shadowBlur=p*.7;
  const gr=g.createLinearGradient(0,p,0,p+h*1.05);gr.addColorStop(0,'rgba(255,255,255,.97)');gr.addColorStop(.5,'rgba('+T.m+',.93)');gr.addColorStop(1,'rgba('+T.l+',.93)');
  g.fillStyle=gr;g.beginPath();P.forEach(q=>{g.moveTo(q[0]+q[2],q[1]);g.arc(q[0],q[1],q[2],0,6.283)});g.fill();
  g.shadowBlur=0;g.globalCompositeOperation='source-atop';
  P.slice(0,4).forEach(q=>{const r=g.createRadialGradient(q[0]-q[2]*.3,q[1]-q[2]*.45,0,q[0]-q[2]*.3,q[1]-q[2]*.45,q[2]*.9);r.addColorStop(0,'rgba(255,255,255,.75)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,cw,ch)});
  return{cv,cw,ch}}
function makeClouds(){const Ls=[
  {n:6,w:[.1,.4],v:[3,5],y:[.04,.5],a:.55,T:{g:'205,175,255',m:'228,200,255',l:'200,172,246'}},
  {n:5,w:[.18,.62],v:[7,10],y:[.18,.62],a:.75,T:{g:'255,175,235',m:'255,210,242',l:'232,190,252'}},
  {n:4,w:[.3,1],v:[13,18],y:[.62,.86],a:.9,T:{g:'255,135,208',m:'255,192,232',l:'246,165,220'}}];
  const out=[];Ls.forEach(l=>{for(let i=0;i<l.n;i++){const w=Math.max(70,Math.min(W*(l.w[0]+R()*(l.w[1]-l.w[0])),900)),s=cloudSprite(w,l.T);
    out.push({cv:s.cv,cw:s.cw,ch:s.ch,x:(i+R()*.8)/l.n*(W+s.cw)-s.cw,y:H*(l.y[0]+R()*(l.y[1]-l.y[0]))-s.ch/2,v:l.v[0]+R()*(l.v[1]-l.v[0]),a:l.a,ph:R()*6.3,tw:[0,1,2].map(()=>({dx:R(),dy:R(),r:3+R()*4,ph:R()*6.3,sp:1+R()*2}))})}});return out}
function drawClouds(t,dt){cl.forEach(c=>{c.x+=c.v*dt;if(c.x>W)c.x=-c.cw;const y=c.y+Math.sin(t*.35+c.ph)*7;
  x.globalAlpha=c.a*(.9+.1*Math.sin(t*.6+c.ph));x.drawImage(c.cv,c.x,y,c.cw,c.ch);x.globalAlpha=1;
  c.tw.forEach(q=>spark({x:c.x+c.cw*(.12+.76*q.dx),y:y+c.ch*(.18+q.dy*.35),r:q.r,ph:q.ph,sp:q.sp,rot:0},t))})}
function makeMoon(){const r=Math.max(34,Math.min(Math.min(W,H)*.1,74)),pad=r*.1,S=r*2+pad*2,cv=document.createElement('canvas');cv.width=cv.height=Math.ceil(S*D);const g=cv.getContext('2d');g.scale(D,D);const c=S/2;
  const gr=g.createRadialGradient(c-r*.4,c-r*.35,r*.1,c,c,r);gr.addColorStop(0,'#ffffff');gr.addColorStop(.55,'#fff0fb');gr.addColorStop(1,'#f9b9ea');
  g.fillStyle=gr;g.beginPath();g.arc(c,c,r,0,6.283);g.fill();
  g.globalCompositeOperation='destination-out';g.beginPath();g.arc(c+r*.5,c-r*.12,r*.86,0,6.283);g.fill();
  return{cv,r,S}}
function drawMoon(t){if(!mn)return;const r=mn.r,S=mn.S,mx=W*.8,my=Math.max(r*1.4,H*.15)+Math.sin(t*.3)*3,gx=mx-r*.35,pu=.5+.5*Math.sin(t*.9);
  x.globalAlpha=.4+.3*pu;x.drawImage(MG,gx-r*3.4,my-r*3.4,r*6.8,r*6.8);x.globalAlpha=1;
  x.drawImage(mn.cv,mx-S/2,my-S/2,S,S);
  [[-.95,-.55,.16],[-.2,.95,.12],[.55,-.95,.1]].forEach((q,i)=>spark({x:mx+q[0]*r*1.15,y:my+q[1]*r*1.15,r:r*q[2]*1.3+5,ph:i*2.1,sp:1.5+i*.4,rot:0},t))}
function drawShoot(t,dt){if(dt>0&&t>nextSS){const a=(25+R()*25)*Math.PI/180,sp=420+R()*260,dir=R()<.7?-1:1;
    ss.push({x:W*(dir<0?.25+R()*.75:R()*.75),y:-10+R()*H*.35,vx:dir*Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:.9+R()*.6,len:110+R()*80});nextSS=t+3+R()*6}
  ss=ss.filter(s=>s.age<s.life);
  ss.forEach(s=>{s.age+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const k=s.age/s.life,al=Math.min(1,k*8)*(1-k*k),m=Math.hypot(s.vx,s.vy),tx=s.x-s.vx/m*s.len,ty=s.y-s.vy/m*s.len;
    const g=x.createLinearGradient(s.x,s.y,tx,ty);g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(.4,'rgba(255,190,240,'+(al*.55)+')');g.addColorStop(1,'rgba(200,170,255,0)');
    x.strokeStyle=g;x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(s.x,s.y);x.lineTo(tx,ty);x.stroke();
    const h=x.createRadialGradient(s.x,s.y,0,s.x,s.y,14);h.addColorStop(0,'rgba(255,255,255,'+al+')');h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.beginPath();x.arc(s.x,s.y,14,0,6.283);x.fill();
    x.globalAlpha=al;spark({x:s.x,y:s.y,r:7,ph:0,sp:0,rot:0},t);x.globalAlpha=1})}
function init(){D=Math.min(window.devicePixelRatio||1,1);SP=mkSpark();BK=mkSoft(1,"255,255,255");MG=mkSoft(1,"255,200,244");W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);
  const A=W*H/1000;
  st=Array.from({length:Math.round(Math.max(14,Math.min(34,A/22)))},()=>({x:R()*W,y:R()*H*.9,r:6+R()*14,vx:(R()-.5)*7,vy:(R()-.5)*5,ph:R()*6.3,sp:.4+R()*.8,rot:R()*.4}));
  gl=Array.from({length:Math.round(Math.min(320,A/6))},()=>({x:R()*W,y:R()<.25?R()*H:H*(1-Math.pow(R(),1.8)),r:.6+R()*1.7,ph:R()*6.3,sp:.8+R()*2.4,c:GC[Math.floor(R()*GC.length)]}));
  bk=Array.from({length:18},()=>({x:R()*W,y:H*(.55+R()*.45),r:10+R()*24,ph:R()*6.3,sp:.3+R()*.5}));cl=makeClouds();mn=makeMoon()}
let SP=null;function mkSpark(){const n=96,cv=document.createElement('canvas');cv.width=cv.height=n;const g=cv.getContext('2d'),h=n/2,r=h/1.7,gr=g.createRadialGradient(h,h,0,h,h,h);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(h,h,h,0,6.283);g.fill();
  g.fillStyle='#fff';g.beginPath();const q=r*.14;g.moveTo(h,h-r);g.lineTo(h+q,h-q);g.lineTo(h+r,h);g.lineTo(h+q,h+q);g.lineTo(h,h+r);g.lineTo(h-q,h+q);g.lineTo(h-r,h);g.lineTo(h-q,h-q);g.closePath();g.fill();return cv}
function mkSoft(a0,col){const n=64,cv=document.createElement('canvas');cv.width=cv.height=n;const g=cv.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba('+col+','+a0+')');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(0,0,n,n);return cv}
let BK=null,MG=null;
function spark(s,t){const k=.85+.15*Math.sin(t*s.sp*1.3+s.ph),r=s.r*k*1.7,a=.55+.35*Math.sin(t*s.sp+s.ph),ang=s.rot+Math.sin(t*.2+s.ph)*.12,cs=Math.cos(ang)*D,sn=Math.sin(ang)*D,ga=x.globalAlpha;
  x.setTransform(cs,sn,-sn,cs,s.x*D,s.y*D);x.globalAlpha=a*ga;x.drawImage(SP,-r,-r,r*2,r*2);x.globalAlpha=ga;x.setTransform(D,0,0,D,0,0)}
function draw(now,dt){const t=(now-T0)/1000;x.setTransform(D,0,0,D,0,0);x.clearRect(0,0,W,H);drawMoon(t);drawClouds(t,dt);
  bk.forEach(b=>{x.globalAlpha=.09+.07*Math.sin(t*b.sp+b.ph);x.drawImage(BK,b.x-b.r,b.y-b.r,b.r*2,b.r*2)});x.globalAlpha=1;
  gl.forEach(g=>{const v=Math.max(0,Math.sin(t*g.sp+g.ph)),a=v*v*v;
    x.fillStyle=`rgba(${g.c},${(.12+.88*a).toFixed(2)})`;const z=g.r*(1.6+1.4*a);x.fillRect(g.x-z/2,g.y-z/2,z,z)});
  st.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<-30)s.x=W+30;if(s.x>W+30)s.x=-30;if(s.y<-30)s.y=H*.9;if(s.y>H)s.y=-20;spark(s,t)});drawShoot(t,dt)}
function loop(now){requestAnimationFrame(loop);if(now-last<40)return;const dt=Math.min(.1,(now-last)/1000);last=now;tick=performance.now();try{draw(now,dt)}catch(e){}}
init();addEventListener('resize',()=>{init();if(RM)draw(performance.now(),0)});
const reb=()=>setTimeout(()=>{init();last=0;if(!RM)requestAnimationFrame(loop)},250);
document.addEventListener('fullscreenchange',reb);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reb()});addEventListener('orientationchange',reb);
setInterval(()=>{if(!RM&&!document.hidden&&performance.now()-tick>1500)requestAnimationFrame(loop)},1500);
if(RM)draw(performance.now(),0);else requestAnimationFrame(loop)})();
</script>
